<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06070E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HIKARI — 音を光にする</title>
<style>
  :root{
    --ink:#06070E;
    --bone:#F2F0EA;
    --jade:#5EF2C0;
    --iris:#7C7CFF;
    --ember:#FF7A45;
    --line:rgba(242,240,234,.14);
    --panel:rgba(12,14,24,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone)}
  body{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;left:0;right:0;z-index:5;
    padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    transition:opacity .45s ease, transform .45s ease;
  }
  .hud.top{
    top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    background:linear-gradient(to bottom, rgba(6,7,14,.72), rgba(6,7,14,0));
    padding-bottom:28px;
  }
  .mark{display:flex;flex-direction:column;gap:6px}
  .mark b{
    font-size:15px;letter-spacing:.42em;font-weight:600;
    text-shadow:0 0 22px rgba(94,242,192,.35);
  }
  .mark span{font-size:9px;letter-spacing:.3em;color:rgba(242,240,234,.45)}
  .meta{text-align:right;max-width:58%}
  .track{
    font-size:10.5px;letter-spacing:.08em;color:rgba(242,240,234,.72);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mode-name{
    margin-top:7px;font-size:9px;letter-spacing:.34em;color:var(--jade);
    display:inline-flex;align-items:center;gap:7px;
  }
  .mode-name::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--jade);box-shadow:0 0 12px var(--jade)}

  .hud.bottom{bottom:0;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(to top, rgba(6,7,14,.94), rgba(6,7,14,.55) 42%, rgba(6,7,14,0));
    padding-top:34px;
  }
  .transport{display:flex;align-items:center;gap:12px}
  .time{font-size:10px;letter-spacing:.1em;color:rgba(242,240,234,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
  .time .sep{margin:0 3px;opacity:.4}

  input[type=range]{
    -webkit-appearance:none;appearance:none;background:transparent;height:34px;flex:1;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;border-radius:2px;
    background:linear-gradient(to right, var(--jade) 0 var(--p,0%), rgba(242,240,234,.13) var(--p,0%) 100%);
  }
  input[type=range]::-moz-range-track{
    height:2px;background:linear-gradient(to right, var(--jade) 0 var(--p,0%), rgba(242,240,234,.13) var(--p,0%) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--bone);
    margin-top:-5.5px;box-shadow:0 0 0 4px rgba(94,242,192,.16),0 0 16px rgba(94,242,192,.5);
  }
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--bone)}

  .btn{
    appearance:none;border:1px solid var(--line);background:rgba(242,240,234,.05);
    color:var(--bone);font-family:inherit;font-size:10px;letter-spacing:.2em;
    border-radius:4px;padding:0 12px;height:38px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:background .2s,border-color .2s,color .2s,transform .12s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .btn:active{transform:scale(.96)}
  .btn:hover{border-color:rgba(94,242,192,.5)}
  .btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  .btn.play{
    width:46px;height:46px;min-width:46px;border-radius:50%;font-size:14px;padding:0;
    border-color:rgba(94,242,192,.45);color:var(--jade);
    background:radial-gradient(circle at 50% 40%, rgba(94,242,192,.18), rgba(94,242,192,.02));
  }
  .btn.play.on{border-color:var(--jade);box-shadow:0 0 26px rgba(94,242,192,.28)}
  .btn.on{color:var(--ink);background:var(--jade);border-color:var(--jade)}
  .btn.ghost{background:transparent}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1}
  .modes::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(242,240,234,.04);
    color:rgba(242,240,234,.6);font-family:inherit;font-size:9px;letter-spacing:.18em;
    border-radius:3px;padding:9px 11px;cursor:pointer;transition:.2s;
  }
  .pill[aria-pressed=true]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
  .acts{display:flex;gap:6px}
  .acts .btn{width:46px;padding:0;font-size:9px}

  .sub{font-size:9px;letter-spacing:.16em;color:rgba(242,240,234,.5)}
  .sub .slider{display:flex;align-items:center;gap:9px;flex:1}
  .sub .slider input{flex:1;height:28px}
  .sub .slider i{font-style:normal;color:rgba(242,240,234,.42)}
  #pick{height:32px;font-size:9px}

  /* ---------- intro ---------- */
  .intro{
    position:fixed;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;
    padding:0 26px;transition:opacity .6s ease, visibility .6s;
    background:radial-gradient(58% 34% at 50% 46%, rgba(6,7,14,.72), rgba(6,7,14,.28) 58%, rgba(6,7,14,0) 78%);
  }
  .intro.gone{opacity:0;visibility:hidden}
  .intro-inner{text-align:center;max-width:420px;pointer-events:auto}
  .intro h1{
    margin:0 0 18px;font-weight:400;font-size:clamp(30px,10vw,54px);
    letter-spacing:.14em;line-height:1.15;
    text-shadow:0 0 44px rgba(124,124,255,.5);
  }
  .intro h1 em{font-style:normal;color:var(--jade)}
  .intro p{
    margin:0 auto 26px;font-size:10.5px;line-height:2;letter-spacing:.1em;
    color:rgba(242,240,234,.55);max-width:330px;
  }
  .intro .btn{padding:0 20px;height:44px}
  .intro small{display:block;margin-top:16px;font-size:9px;letter-spacing:.08em;color:rgba(242,240,234,.3)}

  /* ---------- states ---------- */
  body.idle .hud{opacity:0;transform:translateY(6px);pointer-events:none}
  body.idle .intro{opacity:0;visibility:hidden}
  body.focus .hud{opacity:0;pointer-events:none}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);z-index:9;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    color:var(--bone);font-size:10px;line-height:1.7;letter-spacing:.06em;
    padding:11px 14px;max-width:min(88vw,420px);text-align:center;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.3s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (min-width:760px){ body{font-size:14px} .intro p{font-size:11.5px} }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="hud top">
  <div class="mark"><b>HIKARI</b><span>音を光にする</span></div>
  <div class="meta">
    <div class="track" id="track">デモンストレーション</div>
    <div class="mode-name" id="modeName">RING</div>
  </div>
</header>

<div class="intro" id="intro">
  <div class="intro-inner">
    <h1>音を、<em>光</em>に。</h1>
    <p>端末内の音源ファイルを読み込むか、マイク入力をオンにしてください。音に反応して映像が動きます。</p>
    <button class="btn" id="introPick">音源を読み込む</button>
    <small>Apple Music などのDRM保護楽曲は読み込めません</small>
  </div>
</div>

<footer class="hud bottom">
  <div class="transport">
    <button class="btn play" id="play" aria-label="再生">▶</button>
    <div class="time"><span id="cur">0:00</span><span class="sep">/</span><span id="dur">0:00</span></div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
  </div>
  <div class="row">
    <div class="modes" id="modes"></div>
    <div class="acts">
      <button class="btn" id="mic" aria-label="マイク入力" title="マイク入力">MIC</button>
      <button class="btn" id="focus" aria-label="集中モード" title="集中モード">集中</button>
    </div>
  </div>
  <div class="row sub">
    <label class="slider"><span>感度</span><input id="sens" type="range" min="40" max="200" value="100" aria-label="感度"></label>
    <button class="btn ghost" id="pick">音源を読み込む</button>
  </div>
</footer>

<input id="file" type="file" accept="audio/*" hidden>
<audio id="audio" playsinline preload="metadata"></audio>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const cvs = $('#stage');
  const ctx = cvs.getContext('2d', { alpha: false });
  const el = $('#audio');

  const INK = [6, 7, 14], BONE = [242, 240, 234], JADE = [94, 242, 192], IRIS = [124, 124, 255], EMBER = [255, 122, 69];
  const mix = (a, b, t) => {
    t = Math.max(0, Math.min(1, t));
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  };
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, Math.min(1, a))})`;

  /* ---------------------------------------------------------- canvas */
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.max(1, Math.round(W * DPR));
    cvs.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#06070E';
    ctx.fillRect(0, 0, W, H);
    if (specA && (specA.width !== Math.round(W * DPR) || specA.height !== Math.round(H * DPR))) {
      specA = null; specB = null;
      if (LIST[cur].key === 'spectro') setTimeout(() => M.spectro.prime(), 0);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 220));

  /* ---------------------------------------------------------- audio */
  let actx = null, analyser = null, outGain = null, fileNode = null, micNode = null, micStream = null;
  let micLive = false, fileReady = false, sens = 1;
  const freq = new Uint8Array(1024);
  const wave = new Uint8Array(2048);
  let bass = 0, mid = 0, high = 0, level = 0, beat = 0, hist = [], lastBeat = 0;

  async function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.76;
      outGain = actx.createGain();
      outGain.gain.value = 0.9;
      outGain.connect(actx.destination);
    }
    if (actx.state !== 'running') { try { await actx.resume(); } catch (e) {} }
    return actx;
  }

  async function connectFile() {
    await ensureAudio();
    if (!fileNode) {
      try {
        fileNode = actx.createMediaElementSource(el);
        fileNode.connect(analyser);
        fileNode.connect(outGain);
      } catch (e) { /* already connected */ }
    }
  }

  function band(lo, hi) {
    let s = 0;
    for (let i = lo; i < hi; i++) s += freq[i];
    return s / ((hi - lo) * 255);
  }

  function synthesize(t) {
    for (let i = 0; i < freq.length; i++) {
      const f = i / freq.length;
      const v = Math.pow(1 - f, 1.9) * (0.52 + 0.34 * Math.sin(t * 1.6 - f * 26) + 0.14 * Math.sin(t * 0.63 + f * 7.1));
      freq[i] = Math.max(0, Math.min(255, v * 255));
    }
    for (let i = 0; i < wave.length; i++) {
      const p = i / wave.length;
      wave[i] = 128 + 46 * Math.sin(p * Math.PI * 7 + t * 1.4) * Math.sin(p * Math.PI);
    }
  }

  function analyse(t) {
    const live = micLive || (fileReady && !el.paused && !el.ended && el.currentTime > 0);
    if (live && analyser) {
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(wave);
    } else {
      synthesize(t);
    }
    bass = band(1, 9);
    mid = band(9, 64);
    high = band(64, 220);
    level = Math.min(1, band(1, 300) * 2.4);

    hist.push(bass);
    if (hist.length > 42) hist.shift();
    const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
    const now = performance.now();
    if (live && bass > avg * 1.32 && bass > 0.16 && now - lastBeat > 180) { beat = 1; lastBeat = now; }
    beat *= 0.9;
  }

  /* ---------------------------------------------------------- modes */
  let t0 = performance.now(), last = t0, flash = 0, cur = 0;

  const M = {};

  M.ring = {
    label: 'RING', fade: 0.44,
    draw(t) {
      const cx = W / 2, cy = H * 0.475, R = Math.min(W, H) * 0.25;
      const glow = ctx.createRadialGradient(cx, cy, R * 0.15, cx, cy, R * 1.95);
      glow.addColorStop(0, `rgba(124,124,255,${0.05 + bass * 0.20})`);
      glow.addColorStop(0.55, `rgba(94,242,192,${0.02 + bass * 0.09})`);
      glow.addColorStop(1, 'rgba(6,7,14,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.95, 0, Math.PI * 2); ctx.fill();

      const N = 240, amp = R * 0.72 * sens * (0.14 + level * 0.95);
      ctx.lineJoin = 'round';
      const path = (scale) => {
        ctx.beginPath();
        for (let i = 0; i <= N; i++) {
          const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
          const half = i <= N / 2 ? i / (N / 2) : (N - i) / (N / 2);
          const bin = 2 + Math.floor(Math.pow(half, 1.5) * 190);
          const v = (freq[bin] || 0) / 255;
          const r = R + v * amp * (0.86 + 0.14 * Math.sin(a * 2 + t * 0.55)) * scale;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
      };
      path(1);
      ctx.strokeStyle = rgba(JADE, 0.05 + beat * 0.07); ctx.lineWidth = 12; ctx.stroke();
      ctx.strokeStyle = rgba(JADE, 0.15 + beat * 0.13); ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = rgba(BONE, 0.72); ctx.lineWidth = 1.3; ctx.stroke();

      ctx.beginPath(); ctx.arc(cx, cy, R * 0.52 + bass * R * 0.06, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(IRIS, 0.14 + mid * 0.45); ctx.lineWidth = 1; ctx.stroke();

      const n = 84;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + t * (0.12 + bass * 0.85);
        const rr = R * (0.62 + ((i % 7) / 7) * 0.82) + Math.sin(t * 1.2 + i) * R * 0.04;
        const s = 0.9 + high * 3.2 + (i % 5) * 0.18;
        ctx.fillStyle = rgba(i % 3 ? IRIS : EMBER, 0.22 + high * 0.5);
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, s, 0, Math.PI * 2); ctx.fill();
      }
    }
  };

  M.terrain = {
    label: 'TERRAIN', fade: 0.26,
    draw(t) {
      const rows = 40;
      const horizon = H * 0.36, floorY = H * 0.79;
      for (let r = rows - 1; r >= 0; r--) {
        const d = r / (rows - 1);                       // 0 = 手前 / 1 = 奥
        const yBase = floorY - Math.pow(d, 1.42) * (floorY - horizon);
        const amp = (1 - d * 0.82) * H * 0.072 * (0.3 + bass * 1.6) * sens;
        ctx.beginPath();
        for (let x = 0; x <= W + 6; x += 6) {
          const p = x / W;
          let k = (p * 0.75 + d * 0.5 + t * 0.06) % 1;
          k = k < 0.5 ? k * 2 : (1 - k) * 2;            // 折り返して継ぎ目を消す
          const v = (wave[Math.floor(k * 1023)] - 128) / 128;
          const y = yBase - v * amp * Math.sin(p * Math.PI);
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        const c = mix(IRIS, JADE, 1 - d);
        ctx.strokeStyle = rgba(c, 0.07 + (1 - d) * 0.36);
        ctx.lineWidth = 0.7 + (1 - d) * 1.5;
        ctx.stroke();
      }
    }
  };

  M.kaleido = {
    label: 'KALEIDO', fade: 0.32,
    draw(t) {
      const SEG = 8, BARS = 26;
      const unit = Math.min(W, H);
      ctx.save();
      ctx.translate(W / 2, H * 0.47);
      ctx.rotate(t * 0.1);
      for (let s = 0; s < SEG; s++) {
        ctx.save();
        ctx.rotate((s / SEG) * Math.PI * 2);
        for (const m of [1, -1]) {
          ctx.save();
          ctx.scale(m, 1);
          for (let b = 0; b < BARS; b++) {
            const v = freq[2 + b * 5] / 255;
            const len = unit * 0.045 + v * unit * 0.36 * sens;
            ctx.save();
            ctx.rotate((b / BARS) * 0.62);
            const c = mix(EMBER, IRIS, b / BARS);
            ctx.strokeStyle = rgba(c, 0.09 + v * 0.55);
            ctx.lineWidth = Math.max(1.2, 3.4 - b * 0.07);
            ctx.beginPath(); ctx.moveTo(unit * 0.04, 0); ctx.lineTo(unit * 0.04 + len, 0); ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }
        ctx.restore();
      }
      ctx.restore();
    }
  };

  const shocks = [];
  M.orbit = {
    label: 'ORBIT', fade: 0.30,
    draw(t, dt) {
      const cx = W / 2, cy = H * 0.46, base = Math.min(W, H) * 0.085;
      for (let i = 0; i < 6; i++) {
        const e = band(2 + i * 9, 11 + i * 9);
        const r = base * (1 + i * 0.62) + e * base * 1.5 * sens + beat * base * 0.2;
        const c = mix(JADE, IRIS, i / 5);
        ctx.strokeStyle = rgba(c, 0.1 + e * 0.55);
        ctx.lineWidth = 0.8 + e * 1.6;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

        for (let d = 0; d < 3; d++) {
          const a = t * (0.18 + i * 0.07 + high * 0.9) + (d / 3) * Math.PI * 2 + i;
          const s = 1.4 + high * 2.4;
          ctx.fillStyle = rgba(d === 1 ? EMBER : c, 0.35 + high * 0.5);
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, s, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (beat > 0.72 && shocks.length < 8) shocks.push({ r: base * 0.8, a: 0.42 });
      for (let i = shocks.length - 1; i >= 0; i--) {
        const s = shocks[i];
        s.r += (dt || 0.016) * Math.min(W, H) * 0.42;
        s.a *= 0.962;
        ctx.strokeStyle = rgba(BONE, s.a * 0.5);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, s.r, 0, Math.PI * 2); ctx.stroke();
        if (s.a < 0.02) shocks.splice(i, 1);
      }
    }
  };

  let specA = null, specB = null, sa = null, sb = null;
  function ensureSpec() {
    if (specA) return;
    specA = document.createElement('canvas');
    specB = document.createElement('canvas');
    [specA, specB].forEach(c => {
      c.width = Math.max(1, Math.round(W * DPR));
      c.height = Math.max(1, Math.round(H * DPR));
    });
    sa = specA.getContext('2d'); sb = specB.getContext('2d');
    sa.setTransform(DPR, 0, 0, DPR, 0, 0);
    sb.setTransform(DPR, 0, 0, DPR, 0, 0);
    [sa, sb].forEach(c => { c.fillStyle = '#06070E'; c.fillRect(0, 0, W, H); });
  }

  M.spectro = {
    label: 'SPECTRO', raw: true,
    column(c, x, sh, gain) {
      const rows = 88, hh = H / rows;
      for (let r = 0; r < rows; r++) {
        const p = r / rows;
        const bin = Math.min(freq.length - 1, Math.floor(Math.pow(1 - p, 2.1) * 330));
        const v = Math.min(1, Math.pow(freq[bin] / 255, 1.8) * gain * 0.7);
        const col = v < 0.5 ? mix(INK, IRIS, v * 2) : mix(IRIS, JADE, (v - 0.5) * 2);
        c.fillStyle = rgba(col, 1);
        c.fillRect(x, p * H, sh, hh + 0.6);
      }
    },
    prime() {
      ensureSpec();
      let mx = 0;
      for (let i = 0; i < freq.length; i++) if (freq[i] > mx) mx = freq[i];
      if (mx < 8) synthesize(performance.now() / 1000);   // 解析前でも空にならないように
      const sh = Math.max(2, Math.round(W * 0.006));
      const now = performance.now() / 1000;
      const live = micLive || (fileReady && !el.paused);
      sa.fillStyle = '#06070E'; sa.fillRect(0, 0, W, H);
      if (!live) {
        for (let x = 0; x < W; x += sh) {
          synthesize(now - ((W - x) / W) * 2.6);      // 直近数秒ぶんの履歴を描いておく
          this.column(sa, x, sh, 1);
        }
      } else {
        for (let x = 0; x < W; x += sh) this.column(sa, x, sh, 1);
      }
      ctx.drawImage(specA, 0, 0, W, H);
    },
    draw() {
      ensureSpec();
      const sh = Math.max(2, Math.round(W * 0.006));
      sb.fillStyle = '#06070E'; sb.fillRect(0, 0, W, H);
      sb.drawImage(specA, -sh, 0, W, H);
      this.column(sb, W - sh, sh, 1);
      ctx.drawImage(specB, 0, 0, W, H);
      const ca = specA, cca = sa;
      specA = specB; sa = sb;
      specB = ca; sb = cca;
    }
  };

  /* ---------------------------------------------------------- loop */
  function draw(t, dt) {
    const m = M[LIST[cur].key];
    if (m.raw) { m.draw(t, dt); flash = 0; return; }
    const fade = (m.fade || 0.3) + flash;
    ctx.fillStyle = `rgba(6,7,14,${Math.min(0.98, fade)})`;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.74;
    if (flash < 0.004) flash = 0;
    m.draw(t, dt);
  }

  function frame(now) {
    const t = (now - t0) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    analyse(t);
    draw(t, dt);
    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------- UI */
  const LIST = [
    { key: 'ring' }, { key: 'terrain' }, { key: 'kaleido' }, { key: 'orbit' }, { key: 'spectro' }
  ];
  const modesEl = $('#modes');
  LIST.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.type = 'button';
    b.textContent = M[m.key].label;
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', () => setMode(i));
    modesEl.appendChild(b);
  });
  function setMode(i) {
    if (i === cur) return;
    cur = (i + LIST.length) % LIST.length;
    flash = 1;
    [...modesEl.children].forEach((b, j) => b.setAttribute('aria-pressed', j === cur));
    $('#modeName').textContent = M[LIST[cur].key].label;
    if (LIST[cur].key === 'spectro') M.spectro.prime();
  }

  const toastEl = $('#toast');
  let toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('on'), 4200);
  }

  const fmt = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  };

  /* play / pause */
  const playBtn = $('#play');
  async function togglePlay() {
    if (!fileReady) { $('#file').click(); return; }
    try {
      if (el.paused) {
        await ensureAudio();
        await connectFile();
        if (micLive) micOff();
        await el.play();
      } else {
        el.pause();
      }
    } catch (e) {
      toast('再生できませんでした: ' + (e && e.name ? e.name : 'unknown'));
    }
  }
  playBtn.addEventListener('click', togglePlay);
  el.addEventListener('play', () => { playBtn.textContent = '❚❚'; playBtn.classList.add('on'); $('#intro').classList.add('gone'); wake(); });
  el.addEventListener('pause', () => { playBtn.textContent = '▶'; playBtn.classList.remove('on'); });
  el.addEventListener('timeupdate', () => {
    const d = el.duration || 0;
    $('#cur').textContent = fmt(el.currentTime);
    $('#seek').value = d ? (el.currentTime / d) * 1000 : 0;
    $('#seek').style.setProperty('--p', (d ? (el.currentTime / d) * 100 : 0) + '%');
  });
  el.addEventListener('loadedmetadata', () => {
    $('#dur').textContent = fmt(el.duration);
    fileReady = true;
  });
  el.addEventListener('ended', () => { playBtn.textContent = '▶'; playBtn.classList.remove('on'); });
  el.addEventListener('error', () => toast('このファイルは再生できません。別の形式（mp3 / m4a / wav）で試してください。'));

  $('#seek').addEventListener('input', e => {
    const d = el.duration;
    if (d) { el.currentTime = (e.target.value / 1000) * d; e.target.style.setProperty('--p', (e.target.value / 10) + '%'); }
  });

  /* file load */
  function loadFile(file) {
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|flac|ogg|opus|aiff?)$/i.test(file.name)) {
      toast('音声ファイルを選んでください。'); return;
    }
    const url = URL.createObjectURL(file);
    el.src = url;
    fileReady = true;
    $('#track').textContent = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 60);
    $('#intro').classList.add('gone');
    if (micLive) micOff();
    ensureAudio().then(connectFile).then(() => el.play()).catch(() => {});
  }
  $('#file').addEventListener('change', e => loadFile(e.target.files && e.target.files[0]));
  $('#pick').addEventListener('click', () => $('#file').click());
  $('#introPick').addEventListener('click', () => $('#file').click());

  document.addEventListener('dragover', e => { e.preventDefault(); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  /* mic */
  async function micOn() {
    try {
      await ensureAudio();
      el.pause();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      micNode = actx.createMediaStreamSource(micStream);
      micNode.connect(analyser);           // 解析のみ（出力しないのでハウリングしない）
      micLive = true;
      $('#mic').classList.add('on');
      $('#track').textContent = 'マイク入力 — スピーカーの音を拾っています';
      $('#intro').classList.add('gone');
      toast('マイク入力を開始しました。スピーカーを大きめに。');
    } catch (err) {
      toast('マイクを使えません（' + (err && err.name ? err.name : 'error') + '）。HTTPSのページでのみ利用できます。');
    }
  }
  function micOff() {
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    try { if (micNode) micNode.disconnect(); } catch (e) {}
    micStream = null; micNode = null; micLive = false;
    $('#mic').classList.remove('on');
  }
  $('#mic').addEventListener('click', () => { micLive ? micOff() : micOn(); });

  /* sensitivity */
  $('#sens').addEventListener('input', e => {
    sens = e.target.value / 100;
    e.target.style.setProperty('--p', ((e.target.value - 40) / 160) * 100 + '%');
  });
  $('#sens').style.setProperty('--p', '37.5%');

  /* focus */
  $('#focus').addEventListener('click', async () => {
    const on = document.body.classList.toggle('focus');
    if (on && document.documentElement.requestFullscreen) {
      try { await document.documentElement.requestFullscreen(); } catch (e) {}
    } else if (!on && document.fullscreenElement && document.exitFullscreen) {
      try { await document.exitFullscreen(); } catch (e) {}
    }
    toast(on ? '集中モード — 画面をタップすると戻ります' : '集中モードを終了しました');
  });
  document.addEventListener('click', e => {
    if (document.body.classList.contains('focus') && !e.target.closest('.hud, .intro')) {
      document.body.classList.remove('focus');
    }
  });

  /* auto hide */
  let wakeT = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(wakeT);
    wakeT = setTimeout(() => {
      if (!el.paused || micLive) document.body.classList.add('idle');
    }, 4000);
  }
  ['pointerdown', 'pointermove', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true }));

  /* keyboard */
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') setMode(cur + 1);
    if (e.key === 'ArrowLeft') setMode(cur - 1);
  });

  /* ---------------------------------------------------------- boot */
  resize();
  const qs = new URLSearchParams(location.search);
  if (typeof window.__MODE__ === 'number') qs.set('mode', String(window.__MODE__));
  if (qs.has('mode')) {
    const i = Math.max(0, Math.min(4, parseInt(qs.get('mode'), 10) || 0));
    setMode(i);
    if (i !== 0) { cur = i; [...modesEl.children].forEach((b, j) => b.setAttribute('aria-pressed', j === cur)); $('#modeName').textContent = M[LIST[cur].key].label; }
  }
  if (qs.has('clean') || window.__CLEAN__) $('#intro').classList.add('gone');

  requestAnimationFrame(frame);
  setTimeout(resize, 60);
})();
</script>
</body>
</html>
